name: dalvo_mobile
description: Dalvo Móvil - Supervisión de proyectos
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dalvo/logo-dalvo.png
    - assets/dalvo/logo-dalvo-blanco.png
    - assets/dalvo/favicon.png
